name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Reject prerelease releases
        if: ${{ github.event.release.prerelease }}
        run: |
          echo "Prerelease GitHub releases are not published to crates.io."
          exit 1

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(cargo +stable metadata --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "runnerctl") | .version')"
          expected_tag="v${version}"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "Release tag '$RELEASE_TAG' does not match expected tag '$expected_tag' from Cargo.toml."
            exit 1
          fi

      - name: Check formatting
        run: cargo +stable fmt --check

      - name: Run clippy
        run: cargo +stable clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo +stable test --locked

      - name: Validate crate publication
        run: cargo +stable publish --dry-run --locked

      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo +stable publish --locked
