[package]
name = "runnerctl"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Manage independent ephemeral GitHub Actions runner pools on one Docker host"
license = "MIT"
repository = "https://github.com/clroot/runnerctl"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
assert_cmd = "2"

[profile.release]
lto = "thin"
strip = true
